  </defs>
  <!-- dial: a 240 degree arc -->
  <path d="M 52.2 197 A 106 106 0 1 1 235.8 197" fill="none" stroke="url(#g)" stroke-width="30" stroke-linecap="round"/>
  <!-- ticks -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <line x1="80" y1="97" x2="93" y2="108"/>
    <line x1="144" y1="62" x2="144" y2="79"/>
    <line x1="208" y1="97" x2="195" y2="108"/>
  </g>
  <!-- needle, pointing fast -->
  <line x1="144" y1="160" x2="214" y2="102" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="144" cy="160" r="20" fill="url(#g)"/>
  <circle cx="144" cy="160" r="8" fill="#ffffff"/>
</svg>
