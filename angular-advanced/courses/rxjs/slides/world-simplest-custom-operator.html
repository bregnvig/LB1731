<section>
  <div class="block" data-type="text" data-name="title" style="left:102px;top:43px;width:1076px;height:auto;z-index:10">
    <h2>World simplest custom operator</h2>
  </div>
  <div class="block" data-type="code" data-name="code-1" data-theme="monokai" style="left:246.5px;top:288px;width:787px;height:85px;z-index:11">
    <pre style="font-size: 20px; line-height: 24px;"><code class="language-typescript">function&lt;T&gt;(source: Observable&lt;T&gt;): Observable&lt;T&gt; {
  return source;
}</code></pre>
  </div>
  <div class="block" data-type="text" data-name="text-1" style="left:240px;top:432px;width:600px;height:auto;z-index:12;text-align:left">
    <p>So an operator receives a source observable and returns an observable, either as the source to the next <em>operator</em>&nbsp;in the <span style="color:#FF8C00">pipe()</span>&nbsp;or the source being <span style="color:#FF8C00">subscribe</span>d to</p>
  </div>
