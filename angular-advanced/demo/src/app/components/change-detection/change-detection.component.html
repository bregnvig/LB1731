<section class="demo-surface zones">
  <div class="zone inside" (mousemove)="mouseMove($event)">
    <code>(mousemove)</code>
    <strong>Inside the zone</strong>
    <span>Move the mouse here: every event runs change detection</span>
  </div>
  <div #outside class="zone outside">
    <code>runOutsideAngular()</code>
    <strong>Outside the zone</strong>
    <span>Events are logged, change detection never runs</span>
  </div>
</section>

<header class="group">
  <h5>Change detection strategies</h5>
  <button class="btn btn-primary" [disabled]="no.value !== 0" (click)="startCounter()">Start</button>
</header>
<div class="cards">
  <loop-input-property [no]="no" />
  <loop-input-property-on-push-by-reference [no]="no" />
  <loop-input-property-on-push-simple-type [no]="no.value" />
</div>

<header class="group">
  <h5>Observable events</h5>
</header>
<div class="cards">
  <loop-observable-events />
</div>

<div class="cards two">
  <div>
    <h5>A Default strategy</h5>
    <loop-observable-events-default/>
  </div>
  <div>
    <h5>Wrapped inside an onPush</h5>
    <loop-wrapped-inside-onpush/>
  </div>
</div>
