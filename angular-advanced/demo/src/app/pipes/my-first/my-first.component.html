<article class="row g-4 align-items-center">
  <div class="col-md-5">
    <div class="mb-3">
      <label for="myFirst" class="form-label">My first</label>
      <input type="text" name="myFirst" [(ngModel)]="myInput" class="form-control form-control-lg" id="myInput">
    </div>
  </div>
  <div class="col-md-7">
    <div class="demo-surface output">
      <small>myInput | myFirst</small>
      {{myInput | myFirst}}
    </div>
  </div>
</article>
