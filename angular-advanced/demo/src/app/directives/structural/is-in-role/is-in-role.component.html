<article class="row g-4">
  <div class="col-lg-4">
    <h5 class="eyebrow">Signed in as</h5>
    <div class="roles">
      <div class="form-check">
        <input class="form-check-input" [formControl]="roleControl" type="radio" value="anonymous" id="anonymous">
        <label class="form-check-label" for="anonymous">
          Anonymous
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" [formControl]="roleControl" type="radio" value="user" id="user">
        <label class="form-check-label" for="user">
          User
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" [formControl]="roleControl" type="radio" value="admin" id="admin">
        <label class="form-check-label" for="admin">
          Admin
        </label>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="demo-surface stage">
      <h5 class="my-4" *loopIsInRole="'anonymous'; role as r">I have acces to role anonymous. My role is {{r}}</h5>
      <h5 class="my-4" *loopIsInRole="'user'; role as r">I have acces to role user. My role is {{r}}</h5>
      <h5 class="my-4" *loopIsInRole="'admin'; role as r; else iWishIWasAdmin">I have acces to role admin. My role is {{r}}</h5>
      <ng-template #iWishIWasAdmin>
        <h5 class="denied">I wish I was an admin😭</h5>
      </ng-template>
    </div>
  </div>
</article>
