<form [formGroup]="fg">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" class="form-control" id="name" formControlName="name">
  </div>
  <div class="form-group group" formGroupName="zipAndCity">
    <label for="zipAndCity">Zip & city <code>zipAndCity</code></label>
    <div id="zipAndCity" class="row g-2">
      <div class="col-auto">
        <input type="text" size="4" class="form-control" id="zip" formControlName="zip">
        <loop-error-message [control]="zipAndCityControl.get('zip')"></loop-error-message>
      </div>
      <div class="col">
        <input type="text" class="form-control" id="city" formControlName="city">
      </div>
    </div>
    <loop-error-message [control]="zipAndCityControl"></loop-error-message>
  </div>
  <div class="status-bar">
    <span class="status">Status: <code>{{ status$ | async }}</code></span>
    <button type="button" class="btn btn-primary" (click)="log()">Log</button>
  </div>
</form>
