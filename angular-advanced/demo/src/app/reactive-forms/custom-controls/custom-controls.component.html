<form [formGroup]="fg">
  <div class="form-group owner">
    <label for="name">Name</label>
    <input type="text" class="form-control" id="name" placeholder="Name" formControlName="name">
    <div class="form-check form-switch">
      <input type="checkbox" class="form-check-input" id="isCompany" formControlName="isCompany">
      <label for="isCompany" class="form-check-label">Is company</label>
    </div>
  </div>
  <div class="addresses">
    <fieldset>
      <legend>Home address <code>homeAddress</code></legend>
      <loop-address-control formControlName="homeAddress"></loop-address-control>
      <loop-error-message [control]="fg.controls.homeAddress"></loop-error-message>
    </fieldset>
    <fieldset>
      <legend>Work address <code>workAddress</code></legend>
      <loop-address-control formControlName="workAddress"></loop-address-control>
      <loop-error-message [control]="fg.controls.workAddress"></loop-error-message>
    </fieldset>
  </div>
</form>
