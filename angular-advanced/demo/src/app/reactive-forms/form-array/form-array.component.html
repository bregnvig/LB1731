<form [formGroup]="fg">
  <div class="form-group adder">
    <label for="email">Email address</label>
    <input #email type="email" class="form-control" id="email" placeholder="Type an address and press Enter" (keydown.enter)="addEmail(email.value)">
  </div>

  <div class="array">
    <h5>Form array content <code>emailAddresses</code></h5>
    <div class="form-group" formArrayName="emailAddresses">
      @for (_ of fg.controls.emailAddresses.controls; track $index) {
        <div class="input-group">
          <span class="input-group-text">{{$index}}</span>
          <input
            type="text"
            class="form-control"
            [formControlName]="$index">
        </div>
      }
    </div>
    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-primary" (click)="save()">Save</button>
    </div>
  </div>
</form>
