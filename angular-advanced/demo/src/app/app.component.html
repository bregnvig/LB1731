<header class="band">
  <div class="bar">
    <a class="brand" routerLink="/">
      <img class="rainbow-hover" src="assets/angular.png" alt="" height="30">
      Angular Advanced
    </a>
    <nav aria-label="Topics">
      @for (topic of topics; track topic.path) {
        <a [routerLink]="topic.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ topic.label }}</a>
      }
    </nav>
  </div>

  @if (topic(); as topic) {
    <div class="title">
      <fa-icon [icon]="topic.icon" />
      <h1>{{ topic.label }}</h1>
      <p>{{ topic.description }}</p>
    </div>
  }
</header>

<main class="stage">
  <router-outlet />
</main>
