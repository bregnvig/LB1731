@let location = location$ | async;
<div class="toolbar">
  <button class="btn btn-primary" (click)="refresh$.next()">Refresh</button>
  @if(!location) {
    <span class="status">
      <fa-icon [icon]="['fas', 'spinner']" animation="spin"/> Getting location
    </span>
  }
</div>
<article class="search-list">
  <label class="search-field">
    <fa-icon [icon]="['fas', 'magnifying-glass']"/>
    <input type="text" placeholder="Filter playgrounds" aria-label="Filter playgrounds" autofocus [formControl]="filterControl">
  </label>
  <ul class="results">
    @if (playgrounds$ | async; as playgrounds) {
      @for (p of playgrounds; track p.id) {
        <li class="result">
          <ngb-highlight [term]="filterControl.value" [result]="p.name"></ngb-highlight>
          <span class="distance">{{p | distance:(location)}}</span>
        </li>
      }
    }
  </ul>
</article>
