    <pre style="font-size: 24px; line-height: 29px; tab-size: 4;"><code class="language-typescript" data-line-numbers="7-9|3">@Component({
  selector: 'app-intercept-child',
  template: '&lt;p&gt;{{value()}}&lt;/p&gt;'
})
class InterceptChildComponent {

  value = input.required&lt;string, string&gt;({
    transform: value =&gt; value.toUpperCase()
  });
