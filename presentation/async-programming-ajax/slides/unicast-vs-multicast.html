<section>
  <div class="block" data-type="text" data-name="title" style="left:64px;top:108px;width:512px;height:auto;z-index:10;text-align:left">
    <h2>unicast vs. multicast</h2>
  </div>
  <div class="block" data-type="text" data-name="text-1" style="left:64px;top:216px;width:512px;height:auto;z-index:11;text-align:left">
    <p>Observables behaviour are unicast by default. I.e not shared.</p>

<p>Subscribing twice could result in two backend calls⚠️</p>

<p>&nbsp;</p>

<p>Use <span style="color:#ff8c00">share</span>, <span style="color:#ff8c00">shareReplay</span>&nbsp;to turn the observable into a multicast.</p>
  </div>
</section>
