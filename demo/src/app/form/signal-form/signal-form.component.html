<h2>Person signal form</h2>
<div class="container">
  <form [formRoot]="fg" (submit)="onSubmit()">
    <fieldset>
      <div class="form-group">
        <label for="firstName">First name</label>
        <input type="text" class="form-control" id="firstName" [formField]="fg.firstName">
      </div>
      <div class="form-group">
        <label for="lastName">Last name</label>
        <input type="text" class="form-control" id="lastName" [formField]="fg.lastName">
      </div>
    </fieldset>
    <div class="form-group">
      <label for="favoriteColor">Favorite color</label>
      <select class="form-control" id="favoriteColor" [formField]="fg.favoriteColor">
        @for (color of colors; track color) {
          <option [value]="color">{{color}}</option>
        }
      </select>
    </div>
    <div class="form-group mb-3">
      <label for="height">Height</label>
      <input type="number" class="form-control" id="height" [formField]="fg.height">
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="fg().invalid()">Submit</button>
  </form>
</div>
