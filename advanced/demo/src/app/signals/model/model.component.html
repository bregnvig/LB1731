<ng-template #playground let-p>
  <h5 class="text-truncate">{{p.name}}</h5>
  <div [style.height.px]="100">
    <p>{{p.description}}</p>
    <p>{{p.addressDescription}}</p>
  </div>
</ng-template>
<div class="map-stage">
  @if(active(); as playgrounds) {
  <loop-pagination [items]="playgrounds" [template]="playground" [(page)]="page" />
  }
  <div class="btn-group city">
    <button type="button" class="btn" [class.active]="city() === 'copenhagen'" (click)="useCopenhagen()">
      Use Copenhagen
    </button>
    <button type="button" class="btn" [class.active]="city() === 'aarhus'" (click)="useAarhus()">
      Use Aarhus
    </button>
  </div>
  <div style="height: 500px;"
    leaflet
    [leafletOptions]="options"
    [leafletLayer]="marker()"
    [leafletCenter]="center()">
  </div>
</div>
