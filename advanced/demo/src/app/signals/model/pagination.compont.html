<div class="card">
  <div class="card-body">
    <div class="card-text">
      <div class="card-text">
        <ng-container [ngTemplateOutlet]="template()" [ngTemplateOutletContext]="{$implicit: items()[page()]}"></ng-container>
      </div>
      <div class="pager">
        <div class="btn-group">
          <button class="btn btn-sm" [disabled]="firstElement()" (click)="firstPage()" aria-label="First">
            <fa-icon [icon]="['fas', 'backward-fast']" />
          </button>
          <button class="btn btn-sm" [disabled]="firstElement()" (click)="prevPage()" aria-label="Previous">
            <fa-icon [icon]="['fas', 'backward']" />
          </button>
        </div>
        <div class="page">
          <input class="form-control" type="number" placeholder="page" aria-label="Page" [formControl]="control" />
          <small class="text-muted">{{page() + 1}} of {{items().length}}</small>
        </div>
        <div class="btn-group">
          <button class="btn btn-sm" [disabled]="lastElement()" (click)="nextPage()" aria-label="Next">
            <fa-icon [icon]="['fas', 'forward']" />
          </button>
          <button class="btn btn-sm" [disabled]="lastElement()" (click)="lastPage()" aria-label="Last">
            <fa-icon [icon]="['fas', 'forward-fast']" />
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
