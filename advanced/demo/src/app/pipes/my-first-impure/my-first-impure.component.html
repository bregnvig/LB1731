<article>
  <div class="row">
    <div class="col-md-5">
      <div class="mb-3">
        <label for="myFirst" class="form-label">My first impure</label>
        <input type="text" name="myFirst" [(ngModel)]="myFirst" class="form-control" id="myFirst">
      </div>
    </div>
  </div>
  <div class="row g-3 align-items-stretch">
    <div class="col-md-3 mouse-pad" (mousemove)="noop()">
      Mouse here🐁
    </div>
    <div class="col-md-3">
      <div class="out">
        <small>myFirst | myFirst</small>
        {{myFirst | myFirst}}
      </div>
    </div>
    <div class="col-md-3">
      <div class="out">
        <small>myFirst | myFirstImpure</small>
        {{myFirst | myFirstImpure}}
      </div>
    </div>
    <div class="col-md-3">
      <div class="out">
        <small>usingAMethod(myFirst)</small>
        {{usingAMethod(myFirst)}}
      </div>
    </div>
  </div>
</article>
