<div class="toolbar">
  <div class="btn-group">
    <button class="btn btn-primary" (click)="fetchPlaygrounds()">Fetch playgrounds</button>
    <button [disabled]="!playgrounds.length" class="btn btn-outline-secondary" (click)="playgrounds = []">Clear</button>
  </div>
</div>
<article class="search-list">
  <label class="search-field">
    <fa-icon [icon]="['fas', 'magnifying-glass']"/>
    <input type="text" placeholder="Filter playgrounds" aria-label="Filter playgrounds" autofocus [(ngModel)]="term" (ngModelChange)="filterPlaygrounds()">
  </label>
  <ul class="results">
    @for (p of playgrounds; track p.id) {
      <li class="result">
        <ngb-highlight [term]="term" [result]="p.name"></ngb-highlight>
        <span class="distance">{{getDistance(p)}}</span>
      </li>
    }
  </ul>
</article>
