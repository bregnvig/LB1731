<div class="row g-4">
  <article class="col-lg-7">
    <div class="search-list">
      <label class="search-field">
        <fa-icon [icon]="['fas', 'magnifying-glass']"/>
        <input type="text" placeholder="Filter playgrounds" aria-label="Filter playgrounds" autofocus [formControl]="filterControl">
      </label>
      <ul class="results">
        @if (playgrounds$ | async; as playgrounds) {
          @for (p of playgrounds; track trackById($index, p)) {
            <a class="result" [routerLink]="[p.id]" queryParamsHandling="merge">
              {{p.name}}
            </a>
          }
        }
      </ul>
    </div>
  </article>
  <article class="col-lg-5">
    <h6 class="params-title">Query params</h6>
    <dl class="readout params">
      @for (param of route.queryParams | async | keyvalue; track param.key) {
        <dt>?{{param.key}}</dt>
        <dd>{{param.value}}</dd>
      } @empty {
        <dt>none</dt>
        <dd></dd>
      }
    </dl>
    <section class="outlet-panel">
      <span class="panel-label d-block mb-2">query/:playgroundId</span>
      <router-outlet></router-outlet>
    </section>
  </article>
</div>
