<section>
  <div class="block" data-type="text" data-name="title" style="left:102px;top:43px;width:1076px;height:auto;z-index:10">
    <h2>3. Overriding the default implementation</h2>
  </div>
  <div class="block" data-type="code" data-name="code-1" data-theme="dark" style="left:160px;top:210px;width:960px;height:288px;z-index:11">
    <pre style="font-size: 30px; line-height: 36px;"><code class="language-typescript">providers: [{
    provide: RandomService,
    useClass: CryptographicallySecureRandomService
}]
</code></pre>
  </div>
  <div class="block" data-type="text" data-name="text-1" style="left:240px;top:558px;width:800px;height:auto;z-index:12">
    <p style="text-align:left">This means that the client will get <span style="color:#FF8C00">CryptographicallySecureRandomService</span>&nbsp;injected instead of <span style="color:rgb(255, 140, 0); text-align:left">RandomService.</span><span style="color:rgb(255, 255, 255); text-align:left">&nbsp;No client code was changed!</span></p>
  </div>
</section>
