<section>
  <div class="block" data-type="text" data-name="title" style="left:64px;top:108px;width:512px;height:auto;z-index:10;text-align:left">
    <h2>Why reactive forms?</h2>
  </div>
  <div class="block" data-type="text" data-name="text-1" style="left:64px;top:216px;width:722px;height:auto;z-index:11;text-align:left">
    <ul>
	<li>
	<p>But why is it called <span style="color:#ff8c00">ReactiveFormsModule</span>?</p>
	</li>
	<li>
	<p>Because of</p>

	<ul>
		<li>
		<p>valueChanges: <span style="color:#ff8c00">Observable&lt;T&gt;</span></p>
		</li>
		<li>
		<p>statusChanges: <span style="color:#ff8c00">Observable&lt;FormControlStatus&gt;</span></p>
		</li>
	</ul>
	</li>
	<li>
	<p>Use these properties to be notified whenever an control value and/or status changes</p>
	</li>
</ul>
  </div>
